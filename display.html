<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shining Together</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px;
    font-size: 11px; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.3); pointer-events: none; line-height: 1.8;
  }
  #clusterMsg {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    font-size: 13px; letter-spacing: 0.2em;
    color: rgba(255,255,255,0);
    transition: color 0.4s; white-space: nowrap;
    text-transform: uppercase;
  }
  #clusterMsg.show { color: rgba(255,255,255,0.7); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>Players <span id="cc">0</span></div>
  <div>Cluster <span id="cl">0</span></div>
</div>
<div id="clusterMsg"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDsWLFW4QQUaRGgyqB7KnoCXKfqiuGhW8M",
  authDomain: "shining-together.firebaseapp.com",
  databaseURL: "https://shining-together-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shining-together",
  storageBucket: "shining-together.firebasestorage.app",
  messagingSenderId: "322280033754",
  appId: "1:322280033754:web:cc2137fbcf38226d7704e3"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let cw, ch;
function resize() { cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const COLOR = {
  red:   { h: '#ff3a3a', r: '255,58,58'   },
  green: { h: '#3aff7a', r: '58,255,122'  },
  blue:  { h: '#3a7aff', r: '58,122,255'  },
};
function ch_(c) { return (COLOR[c] || COLOR.red).h; }

let cursors  = {};
let clusters = [];
let clusterMembers = new Set(); // 哪些 cursor 在 cluster 裡

// ── frequency mapping ────────────────────────────
// 對數映射：100–800 Hz，聽起來更自然、不刺耳
function mapFreq(val) {
  // val: 0~1 → 100~800 Hz (log scale)
  return (100 * Math.pow(8, val)).toFixed(1);
}

// ── cluster detection ────────────────────────────
const CLUSTER_RADIUS    = 0.15;
const CLUSTER_MIN_COUNT = 2;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function findClusters(cur) {
  const ids     = Object.keys(cur);
  const visited = new Set();
  const result  = [];
  for (const id of ids) {
    if (visited.has(id)) continue;
    const group = [id]; visited.add(id);
    for (const other of ids) {
      if (visited.has(other)) continue;
      if (dist(cur[id], cur[other]) < CLUSTER_RADIUS) { group.push(other); visited.add(other); }
    }
    if (group.length >= CLUSTER_MIN_COUNT) {
      const cx = group.reduce((s, i) => s + cur[i].x, 0) / group.length;
      const cy = group.reduce((s, i) => s + cur[i].y, 0) / group.length;
      const colorCount = {};
      group.forEach(i => { colorCount[cur[i].color] = (colorCount[cur[i].color] || 0) + 1; });
      result.push({ members: group, cx, cy, colorCount, size: group.length });
    }
  }
  // 按 size 排序，最大的在前面
  result.sort((a, b) => b.size - a.size);
  return result;
}

// ── UDP bridge to PD ────────────────────────────
function sendToPD(msg) {
  fetch(`http://localhost:9001/pd?msg=${encodeURIComponent(msg)}`).catch(() => {});
}

// ── 防止和弦音符重複觸發（模擬 PD 的 [change]）────
let lastChordMidi = -1;

// ── Firebase listener ────────────────────────────
let prevClusterCount = 0;

onValue(ref(db, 'cursors'), snap => {
  cursors  = snap.val() || {};
  clusters = findClusters(cursors);

  // 更新哪些 cursor 在 cluster 裡
  clusterMembers = new Set();
  clusters.forEach(cl => cl.members.forEach(id => clusterMembers.add(id)));

  document.getElementById('cc').textContent = Object.keys(cursors).length;
  document.getElementById('cl').textContent = clusters.length;

  // ── 個人音色（用對數映射，100-800 Hz）──────────
  const colorPresent = { red: false, green: false, blue: false };

  for (const cur of Object.values(cursors)) {
    const c = cur.color;
    const freqX = mapFreq(cur.x);
    const freqY = mapFreq(cur.y);
    colorPresent[c] = true;

    if (c === 'red')   sendToPD(`RED ${freqX} ${freqY}`);
    if (c === 'green') sendToPD(`GREEN ${freqX} ${freqY}`);
    if (c === 'blue')  sendToPD(`BLUE ${freqX} ${freqY}`);
  }

  // 沒有該顏色時發 0 0，讓 PD 靜音
  if (!colorPresent.red)   sendToPD(`RED 0 0`);
  if (!colorPresent.green) sendToPD(`GREEN 0 0`);
  if (!colorPresent.blue)  sendToPD(`BLUE 0 0`);

  // ── Cluster 訊號（只取最大的一個）──────────────
  if (clusters.length > 0) {
    const cl = clusters[0]; // 只取最大的 cluster
    const intensity = (cl.size / Math.max(Object.keys(cursors).length, 1)).toFixed(4);
    sendToPD(`CLUSTER ${cl.cx.toFixed(4)} ${cl.cy.toFixed(4)} ${intensity} ${cl.size}`);

    // ── CHORD 觸發（cy → MIDI 音符）──────────────
    // C3(48) ~ C5(72)，只在音符改變時才發
    const midi = Math.round(48 + cl.cy * 24);
    if (midi !== lastChordMidi) {
      lastChordMidi = midi;
      sendToPD(`CHORD ${midi} ${cl.size}`);
    }
  } else {
    sendToPD(`CLUSTER 0 0 0 0`);
    lastChordMidi = -1; // 重置，下次聚集時一定會觸發
  }

  // ── cluster message ────────────────────────────
  if (clusters.length > prevClusterCount) {
    const cl   = clusters[0];
    const zh   = { red: 'Red', green: 'Green', blue: 'Blue' };
    const cols = Object.keys(cl.colorCount).map(c => zh[c] || c).join('・');
    const el   = document.getElementById('clusterMsg');
    el.textContent = `${cols} Cluster × ${cl.size}`;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
  prevClusterCount = clusters.length;
});

// ── draw loop ────────────────────────────────────
// 每個 cursor 的動畫狀態（光暈大小平滑過渡）
const glowState = {}; // id → current glow multiplier (0~1 smoothly)

function draw(ts) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);

  // ── additive blending for colour mixing ────────
  ctx.globalCompositeOperation = 'lighter';

  for (const [id, cur] of Object.entries(cursors)) {
    const px  = cur.x * cw, py = cur.y * ch;
    const hex = ch_(cur.color);
    const inCluster = clusterMembers.has(id);

    // 平滑過渡 glow（靠近時慢慢變大，離開時慢慢縮小）
    if (!glowState[id]) glowState[id] = 0;
    const target = inCluster ? 1 : 0;
    glowState[id] += (target - glowState[id]) * 0.08;

    // 基礎半徑 70，cluster 時膨脹到 140，加上呼吸脈動
    const pulse    = inCluster ? Math.sin(ts * 0.003) * 12 : 0;
    const baseSize = 70;
    const maxExtra = 70; // 最大額外膨脹
    const radius   = baseSize + glowState[id] * maxExtra + pulse;

    // 外層光暈
    const g = ctx.createRadialGradient(px, py, 0, px, py, radius);
    g.addColorStop(0,   hex + 'cc');
    g.addColorStop(0.3, hex + '66');
    g.addColorStop(0.6, hex + '22');
    g.addColorStop(1,   'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI*2); ctx.fill();

    // cluster 時多一層更亮的內核光
    if (glowState[id] > 0.1) {
      const g2 = ctx.createRadialGradient(px, py, 0, px, py, 30);
      const alpha = Math.round(glowState[id] * 180).toString(16).padStart(2, '0');
      g2.addColorStop(0, '#ffffff' + alpha);
      g2.addColorStop(1, 'transparent');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(px, py, 30, 0, Math.PI*2); ctx.fill();
    }
  }

  // ── white core dots ────────────────────────────
  ctx.globalCompositeOperation = 'source-over';
  for (const [id, cur] of Object.entries(cursors)) {
    const inCluster = clusterMembers.has(id);
    const coreSize = inCluster ? 7 : 5;
    ctx.fillStyle = inCluster ? '#fff' : 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(cur.x*cw, cur.y*ch, coreSize, 0, Math.PI*2); ctx.fill();
  }

  // ── cluster 視覺效果 ──────────────────────────
  for (const cl of clusters) {
    const px = cl.cx * cw, py = cl.cy * ch;

    // 外圈呼吸脈動
    const ringPulse = Math.sin(ts * 0.002) * 8;
    const ringR = 60 + cl.size * 16 + ringPulse;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, ringR, 0, Math.PI*2); ctx.stroke();

    // 第二圈（更大更淡）
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, ringR + 20, 0, Math.PI*2); ctx.stroke();

    // 成員之間的連線（更亮、實線 + 發光）
    if (cl.members) {
      for (let i = 0; i < cl.members.length; i++) {
        const a = cursors[cl.members[i]]; if (!a) continue;
        for (let j = i+1; j < cl.members.length; j++) {
          const b = cursors[cl.members[j]]; if (!b) continue;

          // 發光底線
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.lineWidth = 4;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(a.x*cw, a.y*ch); ctx.lineTo(b.x*cw, b.y*ch);
          ctx.stroke();

          // 細連線
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = 'rgba(255,255,255,0.25)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x*cw, a.y*ch); ctx.lineTo(b.x*cw, b.y*ch);
          ctx.stroke();
        }
      }
    }
  }

  // 清理已消失的 cursor 的 glowState
  for (const id of Object.keys(glowState)) {
    if (!cursors[id]) delete glowState[id];
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
